<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terkunci</title>
<style>
  :root{
    --bg:#0b0b0f;
    --card:#17171f;
    --text:#f4f4f6;
    --muted:#9a9aa5;
    --accent:#ff3b30;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#e9e9ee;
      --card:#ffffff;
      --text:#15151a;
      --muted:#6b6b76;
    }
  }
  *{box-sizing:border-box;}
  html,body{
    height:100%;
    margin:0;
    background:var(--bg);
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }

  /* ---------- START SCREEN ---------- */
  #start{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:24px; text-align:center;
    background:var(--bg); color:var(--text);
  }
  #start h1{ font-size:22px; margin:0; }
  #start p{ color:var(--muted); font-size:14px; max-width:320px; margin:0; }
  #startBtn{
    padding:14px 28px; border-radius:999px; border:none;
    background:var(--accent); color:#fff; font-size:16px; font-weight:600;
    cursor:pointer;
  }

  /* ---------- LOCK SCREEN ---------- */
  #lock{
    position:fixed; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; color:#fff; text-align:center; z-index:50;
    animation: flicker .25s ease-in-out 2;
  }
  @keyframes flicker{ 0%{opacity:.2} 50%{opacity:1} 100%{opacity:.4} }

  #lockImg{
    max-width:78vw; max-height:48vh; border-radius:18px;
    box-shadow:0 10px 40px rgba(0,0,0,.6);
    margin-bottom:22px;
    animation: shake 2.4s ease-in-out infinite;
  }
  @keyframes shake{
    0%,100%{ transform:rotate(0deg) scale(1); }
    25%{ transform:rotate(-2deg) scale(1.02); }
    75%{ transform:rotate(2deg) scale(1.02); }
  }

  #lockTitle{
    font-size:26px; font-weight:800; letter-spacing:.5px; margin:0 0 6px;
    color:var(--accent);
  }
  #lockSub{ font-size:14px; color:#c9c9cf; margin:0 0 20px; }

  #ring{
    position:relative; width:120px; height:120px; margin-bottom:10px;
  }
  #ring svg{ width:100%; height:100%; transform:rotate(-90deg); }
  #ring circle{
    fill:none; stroke-width:8;
  }
  #ringBg{ stroke:#2a2a33; }
  #ringFg{
    stroke:var(--accent);
    stroke-linecap:round;
    stroke-dasharray:326.7;
    stroke-dashoffset:0;
    transition: stroke-dashoffset 1s linear;
  }
  #ringNum{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:34px; font-weight:800;
  }

  #lockFoot{ font-size:12px; color:#8a8a93; margin-top:14px; }

  /* ---------- DONE ---------- */
  #done{
    position:fixed; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); text-align:center; gap:10px; padding:24px;
  }
  #done h2{ margin:0; font-size:22px; }
  #done p{ color:var(--muted); margin:0; max-width:300px; font-size:14px; }
  #again{
    margin-top:14px; padding:10px 22px; border-radius:999px; border:1px solid var(--muted);
    background:transparent; color:var(--text); font-size:14px; cursor:pointer;
  }
</style>
</head>
<body>

  <div id="start" style="display:none;">
    <h1>🔒 Bengbeng Lock</h1>
    <p>Prank ringan — tekan tombol di bawah buat "mengunci" layar selama 30 detik. Cuma jalan di halaman ini, nggak nyentuh sistem HP sama sekali.</p>
    <button id="startBtn">Kunci sekarang</button>
  </div>

    <div id="lockTitle">HP TERKUNCI</div>
    <div id="lockSub">Adek nak bengbeng tak? 🤨</div>
    <div id="ring">
      <svg viewBox="0 0 120 120">
        <circle id="ringBg" cx="60" cy="60" r="52"></circle>
        <circle id="ringFg" cx="60" cy="60" r="52"></circle>
      </svg>
      <div id="ringNum">30</div>
    </div>
    <div id="lockFoot">akan terbuka otomatis…</div>
  </div>

  <div id="done">
    <h2>✅ Terbuka!</h2>
    <p>Cuma prank. Nggak ada yang beneran dikunci di HP kamu 😄</p>
    <button id="again">Ulangi</button>
  </div>

<script>
  const startScreen = document.getElementById('start');
  const lockScreen = document.getElementById('lock');
  const doneScreen = document.getElementById('done');
  const ringFg = document.getElementById('ringFg');
  const ringNum = document.getElementById('ringNum');
  const CIRC = 326.7;
  const DURATION = 30;

  function runLock(){
    startScreen.style.display = 'none';
    doneScreen.style.display = 'none';
    lockScreen.style.display = 'flex';

    let remaining = DURATION;
    ringNum.textContent = remaining;
    ringFg.style.strokeDashoffset = 0;

    const interval = setInterval(() => {
      remaining -= 1;
      ringNum.textContent = Math.max(remaining,0);
      const progress = (DURATION - remaining) / DURATION;
      ringFg.style.strokeDashoffset = CIRC * progress;
      if (remaining <= 0){
        clearInterval(interval);
        lockScreen.style.display = 'none';
        doneScreen.style.display = 'flex';
      }
    }, 1000);
  }

  document.getElementById('startBtn').addEventListener('click', runLock);
  document.getElementById('again').addEventListener('click', runLock);

  // Langsung terkunci begitu halaman dibuka
  window.addEventListener('DOMContentLoaded', runLock);
</script>
